name: Desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New release tag, for example v0.1.0'
        type: string
        required: true
        default: v0.1.0
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

concurrency:
  group: desktop-release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate version
        id: validate
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          from scripts.export_game import version_number
          tag = os.environ['RELEASE_VERSION']
          version_number(tag)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\n')
          PY
  checks:
    uses: ./.github/workflows/ci.yml
  security:
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      actions: read
      security-events: write
  build:
    name: Build (${{ matrix.platform }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
          - platform: macos
            os: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true
      - name: Export, run packaged game and create archive
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.tag }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: python scripts/export_game.py --platform "$RELEASE_PLATFORM" --version "$RELEASE_VERSION"
        shell: bash
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  publish:
    name: Publish verified downloads
    needs: [version, checks, security, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - name: Verify checksums and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version.outputs.tag }}
        run: python3 scripts/publish_release.py --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
